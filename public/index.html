<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivos compartidos</title>
  <style>
    :root { color-scheme: light dark; --fg:#1b1b1f; --bg:#fafaf7; --mute:#6b6b73; --line:#e3e3dc; --acc:#f38020; }
    @media (prefers-color-scheme: dark) { :root { --fg:#ececf0; --bg:#141416; --mute:#9a9aa3; --line:#2a2a2e; } }
    body { margin:0; font:16px/1.5 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
    main { max-width:760px; margin:0 auto; padding:40px 16px; }
    h1 { margin:0 0 4px; font-size:1.6rem; }
    p { color:var(--mute); margin:0 0 24px; }
    table { width:100%; border-collapse:collapse; }
    td { padding:10px 4px; border-bottom:1px solid var(--line); word-break:break-word; }
    td:last-child { text-align:right; color:var(--mute); white-space:nowrap; }
    a { color:var(--acc); text-decoration:none; } a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <main>
    <h1>Archivos compartidos</h1>
    <p>Esta lista se actualiza sola cada vez que alguien sube un archivo al repositorio.</p>
    <table>
      <!--LISTA-->
    </table>
  </main>
</body>
</html>
