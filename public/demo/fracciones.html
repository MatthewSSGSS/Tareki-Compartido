<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fracciones · Lección de muestra</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<!-- Lección de MUESTRA para probar Tareki. Guarda su progreso igual que las
     lecciones reales (ld-progress, ld-ficha-hist) y define KEY, FTOP, GAMES y TIPS. -->
<style>
:root{ --bg:#eaf6ff; --ink:#1f2544; --card:#fff; --muted:#4a5075; --line:#1f2544; --soft:#f3f8ff; --sun:#ffcf3f; --pink:#ff6b9a; --green:#35b862; --blue:#59c3ff; --bad:#d6414f;
  --f-head:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --f-body:"Nunito","Trebuchet MS",system-ui,sans-serif; color-scheme:light; }
@media (prefers-color-scheme: dark){ :root{ --bg:#121a33; --ink:#f2f4ff; --card:#1f2a4d; --muted:#b9c0e6; --line:#0a0f22; --soft:#26335c; color-scheme:dark; } }
*{box-sizing:border-box} body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-weight:700; font-size:17px; line-height:1.45}
h1,h2,h3{font-family:var(--f-head); font-weight:800; line-height:1.1; margin:0}
button{font:inherit; color:inherit}
.wrap{max-width:640px; margin:0 auto; padding:16px 16px 60px}
.card{background:var(--card); border:3px solid var(--line); border-radius:24px; box-shadow:5px 5px 0 var(--line); padding:18px; margin-top:14px}
.hero{background:#ffcf3f; color:#1f2544; position:relative; overflow:hidden; margin-top:0}
.hero .big{position:absolute; right:12px; bottom:-6px; font-size:84px; line-height:1}
.hero h1{font-size:1.8em; padding-right:90px}
.chip{display:inline-block; background:#fff; border:2px solid #1f2544; border-radius:999px; padding:0 10px; font-size:.85em; margin-top:8px}
.tabs{position:sticky; top:0; z-index:5; background:var(--bg); display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:12px 0 6px}
.tab{background:var(--card); border:3px solid var(--line); border-radius:16px; padding:6px 2px; font-family:var(--f-head); font-weight:800; cursor:pointer; box-shadow:3px 3px 0 var(--line); font-size:.9em}
.tab[aria-selected="true"]{background:var(--green); color:#fff}
.btn{display:flex; width:100%; justify-content:center; font-family:var(--f-head); font-weight:800; font-size:1.15em; background:var(--pink); color:#fff; border:3px solid var(--line); border-radius:999px; padding:10px 22px; box-shadow:4px 4px 0 var(--line); cursor:pointer; margin-top:12px}
.btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--line)}
.pizzas{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:10px 0}
.pz{text-align:center; font-family:var(--f-head); font-size:1.3em}
.say{background:var(--soft); border-radius:14px; padding:8px 12px; margin-top:10px}
.games{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.game{text-align:center; cursor:pointer; color:#1f2544}
.game .e{font-size:48px} .stars{letter-spacing:2px}
.q{font-family:var(--f-head); font-size:1.4em; text-align:center; margin:6px 0}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
.opt{background:var(--card); border:3px solid var(--line); border-radius:16px; padding:12px 8px; font-family:var(--f-head); font-weight:800; font-size:1.3em; cursor:pointer; box-shadow:3px 3px 0 var(--line)}
.opt.ok{background:#8ee0a8; color:#1f2544} .opt.no{background:#ff9dbd; color:#1f2544}
.owl{display:flex; gap:8px; align-items:center; margin-top:12px} .owl span{font-size:34px} .owl p{margin:0; background:var(--soft); border-radius:14px; padding:6px 10px; flex:1}
.prog{height:12px; border:2px solid var(--line); border-radius:9px; background:var(--soft); overflow:hidden} .prog i{display:block; height:100%; background:var(--green); transition:width .3s}
.res{text-align:center} .res .n{font-family:var(--f-head); font-size:3em}
ul{margin:6px 0 0; padding-left:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <div class="card hero"><div style="font-size:.85em;opacity:.85">Lección Divertida · Matemáticas</div><h1>Las fracciones</h1>
    <span class="chip">4.º grado</span> <span class="chip" id="forWho"></span><div class="big" aria-hidden="true">🍕</div></div>
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="aprender" aria-selected="true">📝 Aprender</button>
    <button class="tab" data-tab="juegos" aria-selected="false">🎮 Juegos</button>
    <button class="tab" data-tab="ficha" aria-selected="false">✏️ Ficha</button>
    <button class="tab" data-tab="tips" aria-selected="false">💡 Tips</button>
  </div>
  <div id="box"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function store(k, v){ try{ localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)) }catch(e){} }
function read(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function readJSON(k, d){ try{ const v = JSON.parse(read(k)); return v ?? d }catch(e){ return d } }
const shuffle = a => { const b = [...a]; for(let i = b.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [b[i], b[j]] = [b[j], b[i]]; } return b; };
const pick = a => a[Math.random() * a.length | 0];

const KEY = "fracciones-muestra";
const name = read("ld-name") || "campeón";
let progress = readJSON("ld-progress", {});
function record(field, value){ const r = progress[KEY] ||= {}; r[field] = Math.max(r[field] || 0, value); store("ld-progress", progress); }

const FTOP = {
  con:{ n:"¿Qué es una fracción?", e:"🍕", game:"pizza", q:"Si parto una pizza en 8 pedazos y me como 3, ¿qué fracción me comí?" },
  equ:{ n:"Fracciones equivalentes", e:"⚖️", game:"pizza", q:"¿Por qué 1/2 y 2/4 son la misma cantidad?" },
  com:{ n:"Comparar fracciones", e:"🔍", game:"mayor", q:"¿Qué es más: 1/3 o 1/4 de un chocolate? ¿Por qué?" }
};
const TIPS = {
  consejos:["Usen comida de verdad: una arepa o una pizza partida en pedazos iguales explica más que cualquier dibujo.","Repitan la frase: «el de abajo dice en cuántas partes partí; el de arriba, cuántas tomé».","Para comparar, dibujen las dos fracciones del mismo tamaño, una al lado de la otra."],
  errores:["Creer que 1/4 es más que 1/3 porque 4 es mayor que 3. Entre más partes, más pequeño cada pedazo.","Partir en pedazos de distinto tamaño: en una fracción todos los pedazos son iguales."],
  preguntas:["¿Qué significa el número de abajo de una fracción?","Dibuja 2/4 y 1/2. ¿Qué notas?"],
  casa:"A la hora del postre, que {nombre} reparta en partes iguales y diga qué fracción le tocó a cada uno."
};

function pizza(n, d, size = 90){
  const r = size / 2 - 4, c = size / 2;
  let s = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-label="${n} de ${d}">`;
  for(let i = 0; i < d; i++){
    const a1 = (i / d) * 2 * Math.PI - Math.PI / 2, a2 = ((i + 1) / d) * 2 * Math.PI - Math.PI / 2;
    const x1 = c + r * Math.cos(a1), y1 = c + r * Math.sin(a1), x2 = c + r * Math.cos(a2), y2 = c + r * Math.sin(a2);
    s += `<path d="M${c} ${c} L${x1} ${y1} A${r} ${r} 0 ${d === 1 ? 1 : 0} 1 ${x2} ${y2} Z" fill="${i < n ? "#ff9a4d" : "#fff3cf"}" stroke="#1f2544" stroke-width="3"/>`;
  }
  return s + "</svg>";
}
const pz = (n, d) => `<div class="pz">${pizza(n, d)}<div>${n}/${d}</div></div>`;

// Preguntas por tema
function qCon(){ const d = pick([2,3,4,6,8]), n = 1 + Math.random() * (d - 1) | 0; const ok = `${n}/${d}`;
  return { t:"con", q:`¿Qué fracción está pintada?`, img:pizza(n, d, 110), ok, opts:shuffle([ok, `${d}/${n}`, `${n}/${d + 2}`, `${d - n}/${d}`].filter((x, i, a) => a.indexOf(x) === i)).slice(0, 4) }; }
function qEqu(){ const [a, b] = pick([[1,2],[1,3],[2,3],[1,4],[3,4]]), k = pick([2,3]); const ok = `${a * k}/${b * k}`;
  return { t:"equ", q:`¿Cuál es igual a ${a}/${b}?`, ok, opts:shuffle([ok, `${a + k}/${b + k}`, `${a * k}/${b}`, `${a}/${b * k}`]) }; }
function qCom(){ const [x, y] = pick([["1/3","1/4"],["1/2","1/5"],["2/3","1/3"],["3/4","1/4"],["1/6","1/2"]]); const val = f => { const [a, b] = f.split("/"); return a / b; }, ok = val(x) > val(y) ? x : y;
  return { t:"com", q:`¿Cuál es mayor?`, ok, opts:shuffle([x, y]) }; }

const GAMES = [
  { id:"pizza", name:"Pizza veloz", emoji:"🍕", f:"pizzaS", gen:() => pick([qCon, qEqu])() },
  { id:"mayor", name:"¿Cuál es mayor?", emoji:"🔍", f:"mayorS", gen:qCom }
];

const box = $("box");
const panes = {
  aprender(){
    box.innerHTML = `<div class="card"><h2>🍕 ¿Qué es una fracción?</h2><p>Es una parte de algo que se partió en <b>pedazos iguales</b>.</p>
      <div class="pizzas">${pz(1,2)}${pz(3,4)}${pz(2,8)}</div>
      <div class="say">El número de <b>abajo</b> dice en cuántas partes partimos. El de <b>arriba</b>, cuántas tomamos.</div></div>
      <div class="card"><h2>⚖️ Fracciones equivalentes</h2><p>Son fracciones distintas que valen <b>lo mismo</b>.</p><div class="pizzas">${pz(1,2)}${pz(2,4)}${pz(4,8)}</div></div>
      <div class="card"><h2>🔍 Comparar</h2><p>Si el de arriba es igual, gana la que tiene el número de abajo <b>más pequeño</b>: sus pedazos son más grandes.</p><div class="pizzas">${pz(1,3)}${pz(1,4)}</div>
      <div class="say">1/3 es mayor que 1/4. ¡Entre más partes, más pequeño cada pedazo!</div></div>
      <button class="btn" onclick="select('juegos')">🎮 ¡A jugar!</button>`;
  },
  juegos(){
    const p = progress[KEY] || {};
    box.innerHTML = `<div class="games">${GAMES.map(g => `<button class="card game" data-g="${g.id}" style="background:${g.id === "pizza" ? "#ffe0b8" : "#d6f0ff"}"><div class="e">${g.emoji}</div><h3>${g.name}</h3><div class="stars">${"⭐".repeat(p[g.f] || 0)}${"☆".repeat(3 - (p[g.f] || 0))}</div></button>`).join("")}</div>`;
    box.querySelectorAll("[data-g]").forEach(b => b.onclick = () => play(GAMES.find(g => g.id === b.dataset.g)));
  },
  ficha(){ fichaMission(); },
  tips(){
    box.innerHTML = `<div class="card"><h2>💡 Consejos</h2><ul>${TIPS.consejos.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="card"><h2>⚠️ Errores comunes</h2><ul>${TIPS.errores.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="card"><h2>🏠 En casa</h2><p>${esc(TIPS.casa.replace("{nombre}", name))}</p></div>`;
  }
};

function play(g){
  const qs = Array.from({ length:5 }, g.gen); let i = 0, right = 0, first = true;
  const draw = () => {
    if(i >= qs.length){
      const stars = right >= 5 ? 3 : right >= 3 ? 2 : 1; record(g.f, stars);
      box.innerHTML = `<div class="card res"><div style="font-size:70px">${stars === 3 ? "🏆" : "🎖️"}</div><div class="stars" style="font-size:2em">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div><h2>¡Muy bien, ${esc(name)}!</h2><p>${right} de ${qs.length} a la primera</p>
        <button class="btn" id="again">🔁 Otra vez</button><button class="btn" style="background:#fff;color:#1f2544" id="out">Elegir otro juego</button></div>`;
      $("again").onclick = () => play(g); $("out").onclick = panes.juegos; return;
    }
    const q = qs[i]; first = true;
    box.innerHTML = `<div class="card"><h3>${g.emoji} ${g.name}</h3><div class="prog"><i style="width:${i * 20}%"></i></div>
      <div class="q">${esc(q.q)}</div>${q.img ? `<div class="pizzas">${q.img}</div>` : ""}
      <div class="opts">${q.opts.map(o => `<button class="opt" data-o="${o}">${o}</button>`).join("")}</div>
      <div class="owl"><span>🦉</span><p id="fb">¡Tú puedes, ${esc(name)}!</p></div></div>`;
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if(b.dataset.o === q.ok){ b.classList.add("ok"); if(first) right++; $("fb").textContent = "¡Eso! 🎉"; i++; setTimeout(draw, 700); }
      else { b.classList.add("no"); first = false; $("fb").textContent = "¡Casi! Intenta otra vez."; }
    });
  };
  draw();
}

function fichaMission(){
  const items = shuffle([qCon(), qCon(), qEqu(), qEqu(), qCom(), qCom()]), ans = {}, t0 = Date.now();
  box.innerHTML = `<div class="card"><h2>✏️ Ficha</h2><p>Responde las ${items.length} preguntas y entrega. ¡Verás tu nota de 1 a 100!</p></div>` +
    items.map((q, k) => `<div class="card"><b>${k + 1}.</b> <span class="q" style="font-size:1.1em">${esc(q.q)}</span>${q.img ? `<div class="pizzas">${q.img}</div>` : ""}<div class="opts">${q.opts.map(o => `<button class="opt" data-k="${k}" data-o="${o}">${o}</button>`).join("")}</div></div>`).join("") +
    `<button class="btn" id="send">📤 Entregar ficha</button>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => { ans[b.dataset.k] = b.dataset.o; box.querySelectorAll(`.opt[data-k="${b.dataset.k}"]`).forEach(x => x.style.background = x === b ? "#59c3ff" : ""); });
  $("send").onclick = () => {
    const t = {}; let ok = 0;
    items.forEach((q, k) => { const good = ans[k] === q.ok; if(good) ok++; t[q.t] ||= [0, 0]; t[q.t][1]++; if(good) t[q.t][0]++; });
    const n = Math.max(1, Math.round(100 * ok / items.length));
    record("ficha100", n);
    const h = readJSON("ld-ficha-hist", []); h.push({ d:new Date().toISOString().slice(0, 10), n, s:Math.round((Date.now() - t0) / 1000), t, h:0 }); store("ld-ficha-hist", h.slice(-12));
    box.innerHTML = `<div class="card res"><div>Tu nota</div><div class="n">${n}</div><p>${ok} de ${items.length} correctas</p><button class="btn" onclick="fichaMission()">🔁 Otra ficha</button></div>`;
  };
}

function select(id){ document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === id)); panes[id](); }
document.querySelectorAll(".tab").forEach(t => t.onclick = () => select(t.dataset.tab));
$("forWho").textContent = `Para ${name}`;
panes.aprender();
</script>
</body>
</html>
